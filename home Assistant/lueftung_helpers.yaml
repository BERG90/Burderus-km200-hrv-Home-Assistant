# Helfer für die Lüftungssteuerung.
# Variante A: diese Datei als Package einbinden (configuration.yaml: homeassistant: packages: ...)
# Variante B: die Helfer in der Oberfläche anlegen (Einstellungen -> Geräte & Dienste -> Helfer).

input_select:
  luftung_betrieb:
    name: Lüftung Betrieb
    icon: mdi:air-filter
    options:
      - Automatisch
      - Stufe 1
      - Stufe 2
      - Stufe 3
      - Stufe 4
    initial: Automatisch

# Wärmerückgewinnung in % aus den drei Temperaturen (Wirkungsgrad Zuluft).
# Nur sinnvoll, wenn Abluft mindestens 3 K wärmer ist als die Außenluft.
template:
  - sensor:
      - name: "Lüftung Wärmerückgewinnung"
        unique_id: luftung_warmeruckgewinnung
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {% set a = states('sensor.logavent_hrv2_sensor_outdoortemp') | float(0) %}
          {% set s = states('sensor.logavent_hrv2_sensor_supplytemp') | float(0) %}
          {% set e = states('sensor.logavent_hrv2_sensor_extracttemp') | float(0) %}
          {{ (((s - a) / (e - a) * 100) | round(0)) if (e - a) >= 3 else 0 }}
        availability: >-
          {{ states('sensor.logavent_hrv2_sensor_outdoortemp') | is_number
             and states('sensor.logavent_hrv2_sensor_supplytemp') | is_number
             and states('sensor.logavent_hrv2_sensor_extracttemp') | is_number
             and (states('sensor.logavent_hrv2_sensor_extracttemp') | float
                  - states('sensor.logavent_hrv2_sensor_outdoortemp') | float) >= 3 }}
