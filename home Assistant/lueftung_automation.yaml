# Lüftung: Stufe nach Luftqualität
# Setzt die manuelle Lüfterstufe der Logavent HRV2 (Modus "Automatisch" der Auswahl
# input_select.luftung_betrieb) oder hält die gewählte feste Stufe.
#   Tags bei Anwesenheit:                      Stufe 3
#   Nachts (22-6 Uhr) oder niemand zuhause:    Stufe 2
#   Hohe VOC-Belastung oder Feuchte >= 70 %:   Stufe 4
#   Nachts bei offenem Bypass:                 Stufe 4 (Nachtkühlung im Sommer)
# Wirkt nur, wenn die Anlage im Modus "Manuell" läuft.
#
# Als YAML-Automation einfügen (Einstellungen -> Automationen -> ⋮ -> In YAML bearbeiten).
alias: "Lüftung: Stufe nach Luftqualität"
description: >-
  Setzt die manuelle Lüfterstufe der Logavent HRV2 oder hält die gewählte feste Stufe.
  Wirkt nur, wenn die Anlage im Modus Manuell läuft.
mode: single
max_exceeded: silent
variables:
  abwesend: "{{ states('zone.home') | int(1) == 0 }}"
  aktuell: "{{ states('number.logavent_hrv2_operationmodes_manual_fansetpoint') | float(3) | round(0) | int }}"
  belastung: "{{ states('sensor.logavent_hrv2_sensor_vocpollution') }}"
  betrieb: "{{ states('input_select.luftung_betrieb') }}"
  feuchte: "{{ states('sensor.logavent_hrv2_sensor_rhvalue') | float(50) }}"
  nacht: "{{ now().hour >= 22 or now().hour < 6 }}"
  bypass_offen: "{{ states('sensor.logavent_hrv2_bypass_state') in ['opening', 'opened'] }}"
triggers:
  - trigger: time_pattern
    minutes: "/5"
  - trigger: state
    entity_id: input_select.luftung_betrieb
  - trigger: state
    entity_id: sensor.logavent_hrv2_operationmodes_activemode
    to: manual
  - trigger: homeassistant
    event: start
conditions:
  - condition: state
    entity_id: sensor.logavent_hrv2_operationmodes_activemode
    state: manual
actions:
  - variables:
      intensiv: >-
        {{ belastung == 'high' or feuchte >= 70 or (aktuell >= 4 and feuchte >= 65)
           or (nacht and bypass_offen) }}
  - variables:
      auto: >-
        {% if intensiv %}4{% elif nacht or abwesend %}2{% else %}3{% endif %}
  - variables:
      ziel: >-
        {% if betrieb == 'Automatisch' %}{{ auto }}{% else %}{{ betrieb[-1] | int(3) }}{% endif %}
  - if:
      - condition: template
        value_template: "{{ ziel | int != aktuell }}"
    then:
      - action: number.set_value
        target:
          entity_id: number.logavent_hrv2_operationmodes_manual_fansetpoint
        data:
          value: "{{ ziel | int }}"
